spring:
  config:
    activate:
      on-profile: local

  # Explicitly kill JWT/OAuth2 resource-server auto-configuration for local runs - otherwise
  # Spring Boot still tries to build a JwtDecoder from the placeholder issuer-uri in the base
  # application.yml even though LocalSecurityConfig never uses it.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

  datasource:
    url: jdbc:h2:mem:tsa_local;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console   # peek at the actual generated tables/rows while testing, if useful

  jpa:
    # Without this, spring.sql.init's INSERTs below run BEFORE Hibernate's create-drop DDL
    # and fail with "table not found" - deferring makes Spring run schema init (JPA) first,
    # data init (the seed script) second.
    defer-datasource-initialization: true
    hibernate:
      # Only for local: let Hibernate create the 20 tables (+ their <TABLE>_SEQ sequences)
      # straight from the @Entity classes under eg.com.ef.tsa.lookupapi.domain, instead of
      # hand-writing a schema script that has to be kept in sync by hand. Real environments
      # keep ddl-auto: validate (see application.yml) - this never touches a shared schema.
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: PUBLIC
        format_sql: true
    show-sql: true

  flyway:
    enabled: false   # nothing to baseline against locally - the schema above is thrown away each run

  sql:
    init:
      mode: always
      data-locations: classpath:local-seed-data.sql

server:
  port: 8081

logging:
  level:
    eg.com.ef.tsa.lookupapi: DEBUG
    org.springframework.jdbc.core: DEBUG
